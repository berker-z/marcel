name: pr

# What a pull request gets before anyone reads it: the checks that need no
# compiler, plus formatting and Clippy. Clippy compiles GPUI, which is why
# `ci.yml` keeps the gate off ordinary pushes; a pull request is rare enough
# here that the minutes are worth spending, and the rust-cache keeps repeat
# runs short. Tests stay with the tag-time gate, where a session bus and the
# packaged build are set up for them.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: versions and desktop metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A pull request has no tag, so this compares the files with each other.
      # A `workflow_dispatch` from a tag passes the tag name as `ci.yml` does.
      - name: Check the version and the Zed revision are the same everywhere
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/check_version.sh "$TAG"

      - name: Validate AppStream metadata
        run: |
          nix run nixpkgs#appstream -- validate --no-net --explain \
            nix/io.github.berker_z.Marcel.metainfo.xml

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: devshell-${{ hashFiles('flake.lock', 'flake.nix') }}

      - name: fmt and clippy
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
          '
