name: cache

# Keep the package Marcel's direct-flake users install in the public Cachix
# cache. Unlike the release CI this runs on every master push, because the
# maintainer's own system configuration tracks master and refuses to compile
# an uncached revision. With Crane holding the compiled dependencies, an
# application-only commit costs minutes here rather than a full GPUI build.
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: build and publish x86_64-linux
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: marcel-rs
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
          useDaemon: false

      # Publish this before the application build so a later application/test
      # failure does not discard a successful GPUI dependency build.
      - name: Build and publish compiled dependencies
        run: |
          deps_path="$(
            nix build --accept-flake-config --no-link --print-out-paths \
              --max-jobs 1 --cores 2 --print-build-logs .#marcel-deps
          )"
          cachix push marcel-rs "$deps_path"

      - name: Build the package
        id: build
        run: |
          package_path="$(
            nix build --accept-flake-config --no-link --print-out-paths \
              --max-jobs 1 --cores 2 --print-build-logs .#marcel-rs
          )"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Publish the runtime closure
        env:
          PACKAGE_PATH: "${{ steps.build.outputs.path }}"
        run: cachix push marcel-rs "$PACKAGE_PATH"
