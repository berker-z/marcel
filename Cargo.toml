[package]
name = "marcel"
version = "0.1.0"
edition = "2024"
description = "A fast, preview-first graphical file explorer"
license = "MIT"
publish = false

# GPUI is unreleased and moves daily, so the Zed revision Marcel builds
# against is a fact worth writing down. It cannot go on the dependency lines:
# gpui-component names the same repository without a revision, and cargo
# refuses a `[patch]` that points a git source back at itself, so a `rev` here
# would split the graph into two GPUIs. `Cargo.lock` is the pin, and
# `scripts/check_version.sh` fails when the lock stops agreeing with this.
[package.metadata.marcel]
zed-rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23"

# The installed command is `marcel-rs`, not `marcel`.
#
# nixpkgs already has a `marcel`: an unrelated Python shell that installs
# `bin/marcel`. Two packages shipping the same path collide in a profile, and
# resolving that with `meta.priority` means silently picking one of two
# unrelated programs. So the command carries the suffix and everything a person
# actually sees stays Marcel: the application name, the icon, the
# `io.github.berker_z.Marcel` application ID and D-Bus name, and the
# `marcel` configuration directory.
#
# The crate keeps its own name, so the library is still `marcel::` internally.
[[bin]]
name = "marcel-rs"
path = "src/main.rs"

# Marcel is Linux-only (src/lib.rs refuses any other target), so the desktop
# dependencies are ordinary ones rather than a `cfg(target_os)` table that
# would suggest the rest of the crate builds without them.
[dependencies]
anyhow = "1"
ashpd = { version = "0.12", default-features = false, features = ["async-std"] }
async-channel = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18.2"
freedesktop-icons = "0.4"
globset = "0.4"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
infer = "0.22"
md-5 = "0.10"
mime_guess = "2"
notify = "7"
png = "0.18"
realfft = "3.5.0"
rustix = { version = "1", features = ["fs", "process"] }
smol = "2"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac"] }
tempfile = "3"
trash = "5"
unicode-width = "0.2"
url = "2"
xattr = "1"
zbus = { version = "5.18", default-features = false, features = ["async-io"] }

[profile.dev]
debug = 1

# Keep Marcel quick to rebuild while running decode/render dependencies with
# representative performance during normal `cargo run` development.
[profile.dev.package."*"]
opt-level = 3

# rustc 1.97 currently ICEs while producing metadata for pulp 0.22 at
# opt-level 3. Keep this isolated SIMD dependency optimized without triggering
# that compiler bug.
[profile.dev.package.pulp]
opt-level = 2

# GCC 15.2 also ICEs in freetype-sys' vendored TrueType sources at `-O3`.
[profile.dev.package.freetype-sys]
opt-level = 2

[profile.release]
lto = "thin"
