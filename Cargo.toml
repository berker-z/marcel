[package]
name = "marcel"
version = "0.1.0"
edition = "2024"
description = "A fast, preview-first graphical file explorer"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2.5"
gpui = "0.2.2"
gpui-component = "0.5.1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
infer = "0.22"
md-5 = "0.10"
mime_guess = "2"
notify = "7"
png = "0.18"
rustix = { version = "1", features = ["fs"] }
smol = "2"
tempfile = "3"
trash = "5"
unicode-width = "0.2"
url = "2"
xattr = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["async-std"] }
freedesktop-icons = "0.4"

[profile.dev]
debug = 1

# Keep Marcel quick to rebuild while running decode/render dependencies with
# representative performance during normal `cargo run` development.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
