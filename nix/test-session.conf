<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  The session bus `desktop_integration`'s integration test runs against.

  Not the dbus package's own session.conf: that one ends with
  `<include ignore_missing="yes">/etc/dbus-1/session.conf</include>`, and on a
  real desktop the file behind that include declares the whole system's
  service directories. The private bus then activates the host's services,
  which reconnect to the host's bus, and the test's own connection lands on a
  different server than `dbus-run-session` started. It fails with a GUID
  mismatch that says nothing about Marcel.

  So this config includes nothing and declares no service directory. The test
  owns a name and forwards to itself; it never needs activation.
-->

<busconfig>
  <type>session</type>

  <listen>unix:tmpdir=/tmp</listen>

  <policy context="default">
    <allow send_destination="*" eavesdrop="true" />
    <allow eavesdrop="true" />
    <allow own="*" />
  </policy>

  <limit name="max_incoming_bytes">1000000000</limit>
  <limit name="max_outgoing_bytes">1000000000</limit>
  <limit name="max_message_size">1000000000</limit>
</busconfig>
